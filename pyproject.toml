[project]
name = "catalejo"
version = "0.1.0"
description = "Recursive Language Model"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "mypy>=2.3.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["catalejo", "tests", "demo.py", "evals.py", "agro.py"]
strict = true
